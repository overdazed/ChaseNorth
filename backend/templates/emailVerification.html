<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background-color: #571100;
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        .content {
            padding: 20px;
            background-color: #f9f9f9;
        }
        .button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #571100;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            margin: 20px 0;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #777;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>ChaseNorth</h1>
    </div>
    <div class="content">
        <h2>Verify Your Email Address</h2>
        <p>Hello,</p>
        <p>please verify your email address by clicking the button below:</p>
        <p style="text-align: center;">
            <a href="{{verificationLink}}" class="button">Verify Email</a>
        </p>
        <p>If you did not request this change, please ignore this email or contact our support team.</p>
        <p>Thank you.</p>
            <p>
                —<br>
                ChaseNorth<br>
            </p>
    </div>
    <div class="footer">
        <p>&copy; {{year}} ChaseNorth. All rights reserved.</p>
    </div>
</body>
</html>
